spring.application.name=Mediconnect
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/MediConnectDb
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.jwtSecret=${JWT_SECRET:CHANGE_MOI_avec_une_cle_base64_secrete_min_256_bits}
jwt.jwtExpirationMs=86400000